name: 慶應入試新聞

on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 06:00 JST（GitHub の混雑で数十分遅れることがあります）
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # ステップの if から参照するためジョブ単位で定義する
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存関係をインストール
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -q fonts-noto-cjk

      - name: ニュースを集めてページを生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m ronbun_news --out docs

      - name: 手書き用のA5 PDFを作成
        continue-on-error: true  # PDF に失敗しても Web 版は更新する
        run: python -m ronbun_news.pdf --out docs

      - name: 生成したページをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "慶應入試新聞 $(TZ=Asia/Tokyo date +%F)"
          git push

      - name: Discord に通知（任意）
        env:
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        if: env.DISCORD_WEBHOOK_URL != ''
        run: |
          curl -fsS -H "Content-Type: application/json" \
            -d "{\"content\": \"📰 今朝の慶應入試新聞が届きました！ 10分でチェックしよう → ${PAGE_URL}\"}" \
            "$DISCORD_WEBHOOK_URL"
